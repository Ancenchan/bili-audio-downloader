<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffe4e9"><title>B站音视频下载器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root { --blue: #ff8fa3; --ink: #6b5560; --muted: #b8a0aa; --pink-soft: #ffe4e9; --glass: rgba(255,255,255,.72); }
* { box-sizing: border-box; }
body { margin: 0px; font-family: "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", ui-sans-serif, sans-serif; color: var(--ink); background-color: rgb(255, 252, 253); background-image: url("https://www.transparenttextures.com/patterns/sakura.png"); background-attachment: fixed; min-height: 100vh; }
header { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0px max(22px, 50% - 560px); border-bottom: 1px solid rgba(255, 228, 233, 0.8); background: rgba(255, 255, 255, 0.68); backdrop-filter: blur(14px); position: sticky; top: 0px; z-index: 50; }
.brand { font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 12px; color: rgb(240, 118, 139); letter-spacing: 1px; }
.logo { background: var(--blue); color: white; border-radius: 14px; padding: 7px 10px; font-size: 20px; }
header span { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
main { max-width: 1000px; margin: 58px auto; padding: 0px 20px; }
.hero { text-align: center; margin-bottom: 32px; padding: 10px 20px; }
.hero h1 { font-size: clamp(24px, 3.4vw, 34px); margin: 0px 0px 12px; }
.hero h1 em { font-style: normal; color: var(--blue); border-bottom: 2px dashed rgb(255, 217, 225); }
.hero p { color: var(--muted); margin: 0px; font-size: 14px; }
.panel { background: var(--glass); backdrop-filter: blur(12px); border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 28px; padding: clamp(20px, 4vw, 38px); box-shadow: rgba(255, 177, 193, 0.15) 0px 10px 40px; }
.formrow { display: flex; gap: 12px; }
.url { flex: 1 1 0%; min-width: 0px; padding: 12px 16px; border: 1.5px solid rgb(255, 211, 221); border-radius: 14px; font-size: 14px; outline: none; background: rgba(255, 255, 255, 0.8); color: var(--ink); transition: 0.3s; }
.url:focus { border-color: var(--blue); box-shadow: rgba(255, 177, 193, 0.22) 0px 0px 0px 4px; background: rgb(255, 255, 255); }
button { border: 0px; border-radius: 12px; padding: 0px 20px; min-height: 44px; background: var(--blue); color: rgb(255, 255, 255); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; box-shadow: rgba(255, 143, 163, 0.28) 0px 4px 12px; letter-spacing: 1px; }
button:disabled { opacity: 0.55; cursor: wait; }
.hint { color: var(--muted); font-size: 12px; margin: 10px 0px 0px; }
.audio-settings { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 20px; }
.setting, .quality-note { padding: 18px; border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 18px; background: rgba(255, 244, 247, 0.55); }
.setting label { display: block; font-weight: 700; margin-bottom: 9px; font-size: 13px; letter-spacing: 2px; color: rgb(217, 127, 147); }
.pitch-select { width: 100%; padding: 12px; border: 1.5px solid rgb(255, 211, 221); border-radius: 14px; background: rgba(255, 255, 255, 0.85); color: var(--ink); font-size: 14px; }
.pitch-slider { width: 100%; accent-color: var(--blue); margin: 12px 0px; }
.pitch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pitch-value { font-size: 15px; font-weight: 800; color: var(--blue); }
.tabs { display: flex; gap: 8px; margin: 22px 0px 12px; flex-wrap: wrap; }
.tab { min-height: 36px; padding: 0px 14px; font-size: 12px; letter-spacing: 1px; background: rgba(255, 228, 233, 0.7); color: var(--ink); border-radius: 999px; }
.tab.active { background: var(--blue); color: rgb(255, 255, 255); }
.task-panel { margin-top: 24px; background: var(--glass); backdrop-filter: blur(12px); border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 24px; box-shadow: rgba(255, 177, 193, 0.12) 0px 10px 40px; }
.task-item { padding: 14px 0px; border-bottom: 1px dashed rgb(255, 217, 225); }
.task-item:last-child { border-bottom: 0px; }
.task-meta { font-size: 12px; color: var(--muted); margin-top: 5px; }
.task-status { font-weight: 700; }
.task-status.error { color: rgb(180, 35, 50); }
.task-status.success { color: rgb(22, 134, 91); }
.progress-track { height: 8px; background: rgb(255, 233, 238); border-radius: 99px; overflow: hidden; margin-top: 9px; }
.progress-fill { height: 100%; width: 0px; background: var(--blue); border-radius: 99px; transition: width 0.35s; }
.log-button { min-height: 34px; padding: 0px 12px; font-size: 12px; background: rgba(255, 228, 233, 0.75); color: var(--ink); margin-top: 10px; }
a.log-button { display: inline-block; line-height: 34px; text-decoration: none; border-radius: 12px; }
.task-logs { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; background: rgb(53, 43, 49); color: rgb(245, 223, 229); border-radius: 10px; padding: 12px; font: 12px / 1.6 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 10px 0px 0px; }
.progress-detail { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 5px; }
.quality-note { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.quality-note strong { color: var(--blue); }
.quality-note p { margin: 0px; color: var(--muted); font-size: 13px; }
.status { display: none; margin-top: 20px; padding: 15px; border-radius: 14px; background: rgba(255, 228, 233, 0.65); color: rgb(164, 104, 122); overflow-wrap: anywhere; }
.status.show { display: block; }
.status.error { background: rgb(255, 233, 236); color: rgb(165, 45, 58); }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
.feature { background: rgba(255, 244, 247, 0.65); border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 18px; padding: 16px 18px; }
.feature b { display: block; margin-bottom: 6px; color: rgb(217, 127, 147); font-size: 13px; letter-spacing: 1px; }
.feature p { font-size: 12px; color: var(--muted); margin: 0px; line-height: 1.7; }
.steps { margin-top: 24px; background: var(--glass); backdrop-filter: blur(12px); border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 24px; box-shadow: rgba(255, 177, 193, 0.12) 0px 10px 40px; }
.steps h2 { font-size: 15px; margin: 0px 0px 16px; color: var(--blue); letter-spacing: 3px; font-weight: 700; }
.steps ol { margin: 0px; padding-left: 22px; color: var(--muted); line-height: 2; font-size: 13px; }
.steps ol li::marker { color: rgb(255, 177, 193); font-weight: 700; }
.foot { font-size: 11px; color: rgb(196, 170, 179); letter-spacing: 1px; text-align: center; margin: 25px 0px 35px; line-height: 1.8; }
@media (max-width: 650px) {
  header { height: 64px; }
  .brand { font-size: 18px; }
  header span { display: none; }
  main { margin: 35px auto; }
  .formrow { flex-direction: column; }
  .formrow button { min-height: 46px; }
  .audio-settings { grid-template-columns: 1fr; }
  .features { grid-template-columns: 1fr; }
  .feature { padding: 14px 16px; }
  .hero p { font-size: 14px; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgb(255, 211, 221); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgb(255, 177, 193); }
::selection { background: rgb(255, 211, 221); color: rgb(107, 85, 96); }
@keyframes softFloat { 
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}
.logo { box-shadow: rgba(255, 143, 163, 0.4) 0px 6px 18px; animation: 4s ease-in-out 0s infinite normal none running softFloat; }
.panel, .task-panel, .steps { transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.panel:hover, .task-panel:hover, .steps:hover { transform: translateY(-4px); box-shadow: rgba(255, 177, 193, 0.22) 0px 15px 45px; }
button { transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: rgba(255, 143, 163, 0.35) 0px 8px 22px; }
.tab:hover { background: rgba(255, 209, 220, 0.9); }
.tab.active:hover { background: var(--blue); }
.log-button:hover { background: rgba(255, 209, 220, 0.9); }
input::placeholder { color: rgb(213, 184, 193); }
.task-panel h2 { font-size: 15px; color: var(--blue); letter-spacing: 3px; font-weight: 700; }
#mode, #quality { display: none; }
.seg-group { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0px 6px; }
.seg-btn { flex: 1 1 0%; min-width: 72px; min-height: 34px; padding: 0px 10px; text-align: center; font-size: 12px; letter-spacing: 1px; font-weight: 500; background: rgba(255, 228, 233, 0.7); color: var(--ink); border-radius: 12px; box-shadow: none; }
.seg-btn.active { background: var(--blue); color: rgb(255, 255, 255); }
.seg-btn:hover:not(.active):not(:disabled) { background: rgba(255, 209, 220, 0.9); }
.seg-btn:disabled { cursor: not-allowed; }

</style>

<body><header><div class="brand"><span class="logo">♫</span> B站音视频下载器</div></header>
<main><section class="panel"><form id="form"><div class="formrow"><input id="url" class="url" type="text" required placeholder="粘贴 B 站链接，或整段分享文案（如【视频标题】https://b23.tv/xxxx）" autocomplete="off"><button id="submit" type="submit">↓ 开始下载</button></div><p class="hint">支持直接粘贴 B 站分享文案，网页会自动识别链接。默认输出 MP3 320 kbps 高音质。</p>
<div class="audio-settings"><div class="setting"><label for="mode">下载类型</label><select id="mode" class="pitch-select"><option value="audio">仅音频（MP3 320 kbps）</option><option value="video">仅视频（MP4，原始音轨）</option><option value="av_pitch">音视频（MP4，可升降调）</option></select><div class="seg-group" data-target="mode"><button type="button" class="seg-btn" data-value="audio">仅音频</button><button type="button" class="seg-btn" data-value="video">仅视频</button><button type="button" class="seg-btn" data-value="av_pitch">音视频</button></div><p class="hint">视频模式保留原始画面与音轨；音视频升降调模式会处理音频并合成回视频。</p><label for="quality" style="margin-top:16px">视频画质</label><select id="quality" class="pitch-select"><option value="best">最高可用画质</option><option value="1080">1080p 及以下（较清晰）</option><option value="720">720p（均衡）</option><option value="480">480p（更省空间）</option><option value="360">360p（小文件）</option><option value="240">240p（最小）</option></select><div class="seg-group" data-target="quality"><button type="button" class="seg-btn" data-value="best">最高</button><button type="button" class="seg-btn" data-value="1080">1080p</button><button type="button" class="seg-btn" data-value="720">720p</button><button type="button" class="seg-btn" data-value="480">480p</button><button type="button" class="seg-btn" data-value="360">360p</button><button type="button" class="seg-btn" data-value="240">240p</button></div><p class="hint">仅限制视频分辨率上限；源视频没有对应画质时，会选取可用的较低画质。</p><label for="pitch" style="margin-top:16px">升降调 <span class="pitch-value" id="pitch-value">0 半音</span></label><input id="pitch" class="pitch-slider" type="range" min="-12" max="12" step="1" value="0" aria-label="升降调半音"><div class="pitch-row"><span class="hint">−12 半音</span><span class="hint">原调</span><span class="hint">+12 半音</span></div><p class="hint">音频模式与音视频模式均可升降调；视频模式保留原始音轨。</p></div></div></form><div id="status" class="status" role="status" aria-live="polite"></div>
</section>
<section class="task-panel"><div class="pitch-row"><h2 style="margin:0">任务查看</h2><button type="button" id="clear-tasks" class="tab">清空记录</button></div><div class="tabs"><button type="button" class="tab active" data-filter="all">全部</button><button type="button" class="tab" data-filter="running">处理中</button><button type="button" class="tab" data-filter="success">已完成</button><button type="button" class="tab" data-filter="error">失败</button></div><div id="task-list"><p class="hint">还没有下载任务。提交下载后会在这里显示状态。</p></div></section><p class="foot">请仅下载你有权保存和使用的内容，并遵守 B 站服务条款及著作权相关规定。<br>免费后端可能休眠；首次请求需要等待服务唤醒。</p></main>
<script>
const API_BASE = "https://bili-audio-api.onrender.com";
const form=document.querySelector("#form"),input=document.querySelector("#url"),button=document.querySelector("#submit"),statusBox=document.querySelector("#status"),modeSelect=document.querySelector("#mode"),pitchSelect=document.querySelector("#pitch"),pitchValue=document.querySelector("#pitch-value"),qualitySelect=document.querySelector("#quality"),taskList=document.querySelector("#task-list");let tasks=[],taskFilter="all";
function syncMode(){pitchSelect.disabled=modeSelect.value==="video";qualitySelect.disabled=modeSelect.value==="audio";const qt=document.querySelector("#quality-text"),qd=document.querySelector("#quality-desc");if(qt)qt.textContent=modeSelect.value==="audio"?"MP3 · 320 kbps · 48 kHz · 立体声":"MP4 · 优先保留最高可用画质";if(qd)qd.textContent=modeSelect.value==="audio"?"优先获取可用的最高质量音轨，再转为 MP3。":modeSelect.value==="video"?"下载视频并保留原始音轨，不重新编码画面。":"下载视频并可调整音高；画面尽量直接复制，避免二次压缩。";}
modeSelect.addEventListener("change",syncMode);syncMode();pitchSelect.addEventListener("input",()=>{const v=Number(pitchSelect.value);pitchValue.textContent=(v>0?"+":"")+v+" 半音";});
function renderTasks(){const logScrolls={};taskList.querySelectorAll(".task-logs").forEach(el=>{logScrolls[el.id]=el.scrollTop;});const visible=tasks.filter(t=>taskFilter==="all"||t.state===taskFilter);taskList.innerHTML=visible.length?visible.map(t=>'<div class="task-item"><div><b>'+escapeHtml(t.title)+'</b> <span class="task-status '+t.state+'">'+({running:"处理中",success:"已完成",error:"失败"}[t.state]||t.state)+'</span></div><div class="task-meta">'+escapeHtml(t.modeLabel)+' · '+escapeHtml(t.createdAt)+'</div><div class="progress-track"><div class="progress-fill" style="width:'+Math.max(0,Math.min(100,Number(t.percent)||0))+'%"></div></div><div class="progress-detail"><span>'+escapeHtml(t.stage||"等待开始")+'：'+escapeHtml(t.message||"")+'</span><b>'+((t.percent!=null)?Math.round(t.percent)+"%":"")+'</b></div><div class="task-meta">'+escapeHtml(t.url)+'</div><button type="button" class="log-button" data-logs="'+escapeHtml(t.id)+'">'+(t.logsExpanded?'隐藏详细日志':'查看详细日志')+'</button>'+(t.state==="success"?' <a class="log-button" href="'+API_BASE+'/api/file/'+encodeURIComponent(t.id)+'" rel="noopener">⤓ 再次保存文件（30分钟内有效）</a>':'')+(t.logsExpanded?'<pre class="task-logs" id="logs-'+escapeHtml(t.id)+'">'+escapeHtml((t.logs||[]).join("\n")||"正在等待后端日志……")+'</pre>':'')+'</div>').join(''):'<p class="hint">当前筛选下没有任务。</p>';taskList.querySelectorAll(".task-logs").forEach(el=>{if(Object.prototype.hasOwnProperty.call(logScrolls,el.id))el.scrollTop=logScrolls[el.id];});}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{taskFilter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));renderTasks()}));document.querySelector("#clear-tasks").addEventListener("click",()=>{tasks=[];renderTasks()});
document.querySelectorAll(".seg-group").forEach(g=>{const sel=document.getElementById(g.dataset.target),btns=[...g.querySelectorAll(".seg-btn")];const refresh=()=>btns.forEach(b=>{b.classList.toggle("active",b.dataset.value===sel.value);b.disabled=sel.disabled;});btns.forEach(b=>b.addEventListener("click",()=>{if(sel.disabled)return;sel.value=b.dataset.value;sel.dispatchEvent(new Event("change"));refresh();}));sel.addEventListener("change",refresh);new MutationObserver(refresh).observe(sel,{attributes:true,attributeFilter:["disabled"]});refresh();});
taskList.addEventListener("click",async event=>{const b=event.target.closest("[data-logs]");if(!b)return;const task=tasks.find(t=>t.id===b.dataset.logs);if(!task)return;task.logsExpanded=!task.logsExpanded;renderTasks();if(task.logsExpanded){await refreshTaskLogs(task);requestAnimationFrame(()=>{const el=document.querySelector("#logs-"+CSS.escape(task.id));if(el)el.scrollTop=el.scrollHeight;});}});
async function refreshTaskLogs(task){try{const r=await fetch(API_BASE+"/api/logs/"+encodeURIComponent(task.id),{cache:"no-store"});if(!r.ok){task.logsError="日志接口返回 HTTP "+r.status+(r.status===404?"（后端可能尚未部署日志接口）":"");}else{const d=await r.json();task.logs=d.logs||[];task.logsError=task.logs.length?"":"后端已连接，但暂时没有该任务的日志。请确认任务是本次页面刷新后新提交的。";}if(task.logsExpanded){const el=document.querySelector("#logs-"+CSS.escape(task.id));if(el){const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-30;el.textContent=task.logsError||task.logs.join("\n")||"后端已连接，但暂时没有日志。";if(atBottom)el.scrollTop=el.scrollHeight;}}}catch(e){task.logsError="无法连接日志接口："+(e&&e.message?e.message:"网络错误");const el=document.querySelector("#logs-"+CSS.escape(task.id));if(task.logsExpanded&&el)el.textContent=task.logsError;}}
function showStatus(message,error=false){statusBox.className="status show"+(error?" error":"");statusBox.textContent=message;}
function extractBilibiliUrl(text){
  const candidates=text.match(/https?:\/\/[^\s<>"'【】「」『』]+/gi)||[];
  for(const candidate of candidates){
    const cleaned=candidate.replace(/[)\]}，。！？、；："'】」』>.,!?;:]+$/g,"");
    try{const parsed=new URL(cleaned);if(/^https?:$/.test(parsed.protocol)&&(/^([a-z0-9-]+\.)*bilibili\.com$/i.test(parsed.hostname)||/^b23\.tv$/i.test(parsed.hostname)))return parsed.href;}catch{}
  }
  return null;
}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const pasted=input.value.trim();
 const url=extractBilibiliUrl(pasted);
 if(!url){showStatus("没有找到有效的 B 站链接。请粘贴包含 https://b23.tv/… 或 https://www.bilibili.com/… 的分享文案。",true);return;}
 if(pasted!==url)showStatus("已从分享文案中识别链接："+url+"\n正在连接服务并提取音频……");
 if(API_BASE.includes("YOUR-RENDER-SERVICE")){showStatus("后端尚未部署完成，请稍后再试。",true);return}
 const taskId="task_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);const task={id:taskId,title:url,modeLabel:({audio:"仅音频 MP3",video:"仅视频 MP4",av_pitch:"音视频 MP4"}[modeSelect.value]),createdAt:new Date().toLocaleTimeString(),state:"running",stage:"连接服务",percent:0,message:"正在连接后端",url};tasks.unshift(task);renderTasks();button.disabled=true;button.textContent="正在处理…";let pollBusy=false,taskDone=false;
 function stopPolling(){clearInterval(progressTimer);button.disabled=false;button.textContent="↓ 提取并下载";}
 function triggerNativeDownload(t){const a=document.createElement("a");a.href=API_BASE+"/api/file/"+encodeURIComponent(t.id);a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}
 async function pollProgress(){
   if(pollBusy||taskDone)return;pollBusy=true;
   try{
     const pr=await fetch(API_BASE+"/api/progress/"+encodeURIComponent(taskId),{cache:"no-store"});
     if(pr.ok){
       const p=await pr.json();
       if(p.state==="ready"){
         taskDone=true;
         if(p.filename)task.title=p.filename;
         task.state="success";task.stage="完成";task.percent=100;task.message="文件已发送至浏览器下载";
         renderTasks();showStatus("转换完成，已触发浏览器下载。若没有弹出保存窗口，可点任务卡片里的「再次保存文件」。");
         triggerNativeDownload(task);stopPolling();
       }else if(p.state==="error"){
         taskDone=true;task.state="error";task.stage="失败";
         task.message=p.error||p.message||"处理失败";
         let friendly=task.message;
         if(/\d+\s*MB/.test(friendly))friendly+=" 可降低视频画质（如 720p / 480p）后重试。";
         renderTasks();showStatus(friendly,true);stopPolling();
       }else{
         task.stage=p.stage||task.stage;task.percent=p.percent??task.percent;task.message=p.message||task.message;
         if(p.speed)task.message+=" · "+p.speed;
         if(p.eta!=null)task.message+=" · 约 "+p.eta+" 秒";
         renderTasks();showStatus(task.stage+"："+task.message);
       }
       if(!taskDone&&task.logsExpanded)await refreshTaskLogs(task);
     }
   }catch{}finally{pollBusy=false}
 }
 const progressTimer=setInterval(pollProgress,1000);
 if(pasted===url)showStatus(modeSelect.value==="audio"?"正在获取最高质量音轨并转换为 MP3 320 kbps。免费服务首次启动可能需要等待一会儿。":modeSelect.value==="video"?"正在下载最高可用画质的视频。免费服务首次启动可能需要等待一会儿。":"正在下载视频"+(Number(pitchSelect.value)?"并进行音高调整":"")+"，然后合成 MP4 文件。免费服务首次启动可能需要等待一会儿。");
 try{
  const response=await fetch(API_BASE+"/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,mode:document.querySelector("#mode").value,pitch:Number(document.querySelector("#pitch").value),task_id:taskId,quality:qualitySelect.value})});
